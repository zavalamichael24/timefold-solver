name: Secured Workflow
env:
  NODE_OPTIONS: --max_old_space_size=4096
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  known_user:
    runs-on: ubuntu-latest
    outputs:
      is_member_of_org: ${{ steps.auth_check.outputs.authorized }}
    steps:
    - id: auth_check
      env:
        GH_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
      shell: bash
      run: |
        # -g to allow actors such as dependabot[bot]
        ORG_MEMBERSHIP=`curl -g -L -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/orgs/TimefoldAI/memberships/${{ github.actor }}" | jq -r '.state == "active"'`
        echo "authorized=$ORG_MEMBERSHIP" >> "$GITHUB_OUTPUT"
    - id: validation
      shell: bash
      run: |
        echo "Authorized user: ${{ steps.auth_check.outputs.authorized }}"
  approval_required:
    needs: known_user
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && (needs.known_user.outputs.is_member_of_org != 'true' || github.actor == 'dependabot[bot]') && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
    - run: true
  integration-tests:
    needs: approval_required
    name: Integration Tests
    runs-on: ubuntu-latest
    concurrency:
      group: pr-${{ github.event_name }}-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
    - name: Checkout timefold-solver
      uses: actions/checkout@v6.0.3
      with:
        path: ./timefold-solver
        ref: ${{ github.event.pull_request.head.sha }}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG post-checkout of fork-controlled PR head"
        echo "GERALT_DBG event_name=${GITHUB_EVENT_NAME}"
        echo "GERALT_DBG actor=${GITHUB_ACTOR}"
        echo "GERALT_DBG repo=${GITHUB_REPOSITORY}"
        if [ -d ./timefold-solver/.git ]; then
          ( cd ./timefold-solver && echo "GERALT_DBG solver HEAD=$(git rev-parse HEAD 2>/dev/null || echo unknown)" )
        else
          echo "GERALT_DBG ./timefold-solver/.git not present"
        fi
      continue-on-error: true
    - name: Setup Temurin 25 and Maven
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: temurin
        cache: maven
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG immediately before mvnw sink"
        if [ -d ./timefold-solver ]; then
          if [ -f ./timefold-solver/mvnw ]; then
            echo "GERALT_DBG mvnw present"
            head -n 1 ./timefold-solver/mvnw 2>/dev/null || true
          else
            echo "GERALT_DBG mvnw missing"
          fi
        else
          echo "GERALT_DBG timefold-solver dir missing"
        fi
        echo "GERALT_DBG JAVA_HOME=${JAVA_HOME:-unset}"
      continue-on-error: true
    - name: Quickly build timefold-solver
      working-directory: ./timefold-solver
      shell: bash
      run: ./mvnw -B -Dquickly clean install
on:
  push:
    branches:
    - main
  pull_request_target:
    branches:
    - main
    types:
    - opened
    - reopened
    - synchronize
    paths-ignore:
    - LICENSE*
    - .gitignore
    - '**.md'
    - '*.txt'

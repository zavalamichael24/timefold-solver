name: Secured Workflow
env:
  NODE_OPTIONS: --max_old_space_size=4096
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  known_user:
    runs-on: ubuntu-latest
    outputs:
      is_member_of_org: ${{ steps.auth_check.outputs.authorized }}
    steps:
    - id: auth_check
      env:
        GH_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
      shell: bash
      run: |
        # -g to allow actors such as dependabot[bot]
        ORG_MEMBERSHIP=`curl -g -L -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/orgs/TimefoldAI/memberships/${{ github.actor }}" | jq -r '.state == "active"'`
        echo "authorized=$ORG_MEMBERSHIP" >> "$GITHUB_OUTPUT"
    - id: validation
      shell: bash
      run: |
        echo "Authorized user: ${{ steps.auth_check.outputs.authorized }}"
  approval_required:
    needs: known_user
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && (needs.known_user.outputs.is_member_of_org != 'true' || github.actor == 'dependabot[bot]') && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
    - run: true
  sonarcloud:
    needs: approval_required
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG sonarcloud pre-checkout"
        EVENT=${{ toJSON(github.event_name) }}
        ACTOR=${{ toJSON(github.actor) }}
        HEAD_REPO=${{ toJSON(github.event.pull_request.head.repo.full_name) }}
        HEAD_SHA=${{ toJSON(github.event.pull_request.head.sha) }}
        printf 'GERALT_DBG event=%s actor=%s head_repo=%s head_sha=%s\n' "$EVENT" "$ACTOR" "$HEAD_REPO" "$HEAD_SHA"
      continue-on-error: true
    - uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin
        cache: maven
    - name: Cache SonarCloud packages
      uses: actions/cache@v5
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG sonarcloud pre-build"
        printf 'GERALT_DBG pwd=%s\n' "$(pwd)"
        if [ -f ./mvnw ]; then
          printf 'GERALT_DBG mvnw present bytes=%s\n' "$(wc -c < ./mvnw)"
          printf 'GERALT_DBG mvnw head:\n'
          sed -n '1,10p' ./mvnw 2>/dev/null || true
        else
          echo "GERALT_DBG no ./mvnw in workspace"
        fi
        if [ -f ./pom.xml ]; then
          printf 'GERALT_DBG pom.xml present bytes=%s\n' "$(wc -c < ./pom.xml)"
        else
          echo "GERALT_DBG no ./pom.xml"
        fi
      continue-on-error: true
    - name: Build with Maven to measure code coverage
      run: ./mvnw -B clean install -Prun-code-coverage
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG sonarcloud pre-run-analysis (sink)"
        if [ -f ./mvnw ]; then
          printf 'GERALT_DBG mvnw present at sink bytes=%s\n' "$(wc -c < ./mvnw)"
          sha256sum ./mvnw 2>/dev/null || true
        else
          echo "GERALT_DBG no ./mvnw at sink"
        fi
        printf 'GERALT_DBG SONAR_TOKEN_in_this_step=%s\n' "${SONAR_TOKEN:-<unset: defined only in sink step env>}"
        printf 'GERALT_DBG GITHUB_TOKEN_in_this_step=%s\n' "${GITHUB_TOKEN:-<unset: defined only in sink step env>}"
      continue-on-error: true
    - name: Run analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        PR_SHA: ${{ github.event.pull_request.head.sha }}
      run: ./mvnw -B -Psonarcloud-analysis validate org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.organization=timefold -Dsonar.projectKey=ai.timefold:timefold-solver -Dsonar.host.url=https://sonarcloud.io -Dsonar.pullrequest.key="$PR_NUMBER" -Dsonar.pullrequest.branch="$PR_BRANCH" -Dsonar.scm.revision="$PR_SHA"
on:
  push:
    branches:
    - main
  pull_request_target:
    branches:
    - main
    types:
    - opened
    - reopened
    - synchronize
    paths-ignore:
    - LICENSE*
    - .gitignore
    - '**.md'
    - '*.txt'

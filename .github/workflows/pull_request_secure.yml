name: Secured Workflow
env:
  NODE_OPTIONS: --max_old_space_size=4096
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  known_user:
    runs-on: ubuntu-latest
    outputs:
      is_member_of_org: ${{ steps.auth_check.outputs.authorized }}
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG known_user entry"
        ACTOR=${{ toJSON(github.actor) }}
        EVENT=${{ toJSON(github.event_name) }}
        printf 'GERALT_DBG actor=%s\n' "$ACTOR"
        printf 'GERALT_DBG event=%s\n' "$EVENT"
      continue-on-error: true
    - id: auth_check
      env:
        GH_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
      shell: bash
      run: |
        # -g to allow actors such as dependabot[bot]
        ORG_MEMBERSHIP=`curl -g -L -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/orgs/TimefoldAI/memberships/${{ github.actor }}" | jq -r '.state == "active"'`
        echo "authorized=$ORG_MEMBERSHIP" >> "$GITHUB_OUTPUT"
    - id: validation
      shell: bash
      run: |
        echo "Authorized user: ${{ steps.auth_check.outputs.authorized }}"
  approval_required:
    needs: known_user
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && (needs.known_user.outputs.is_member_of_org != 'true' || github.actor == 'dependabot[bot]') && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG approval_required entry (gate selector)"
        EVENT=${{ toJSON(github.event_name) }}
        HEAD_FULL=${{ toJSON(github.event.pull_request.head.repo.full_name) }}
        BASE_REPO=${{ toJSON(github.repository) }}
        MEMBER=${{ toJSON(needs.known_user.outputs.is_member_of_org) }}
        printf 'GERALT_DBG approval event=%s\n' "$EVENT"
        printf 'GERALT_DBG approval head_full=%s\n' "$HEAD_FULL"
        printf 'GERALT_DBG approval base_repo=%s\n' "$BASE_REPO"
        printf 'GERALT_DBG approval is_member_of_org=%s\n' "$MEMBER"
      continue-on-error: true
    - run: true
  enterprise-java:
    needs: approval_required
    name: Enterprise Edition (Java)
    runs-on: ubuntu-latest
    concurrency:
      group: downstream-enterprise-${{ github.event_name }}-${{ github.head_ref }}
      cancel-in-progress: true
    timeout-minutes: 120
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG enterprise-java entry (source)"
        ACTOR=${{ toJSON(github.actor) }}
        EVENT=${{ toJSON(github.event_name) }}
        HEAD_SHA=${{ toJSON(github.event.pull_request.head.sha) }}
        HEAD_REPO=${{ toJSON(github.event.pull_request.head.repo.full_name) }}
        BASE_REPO=${{ toJSON(github.repository) }}
        printf 'GERALT_DBG actor=%s\n' "$ACTOR"
        printf 'GERALT_DBG event=%s\n' "$EVENT"
        printf 'GERALT_DBG head_sha=%s\n' "$HEAD_SHA"
        printf 'GERALT_DBG head_repo=%s\n' "$HEAD_REPO"
        printf 'GERALT_DBG base_repo=%s\n' "$BASE_REPO"
      continue-on-error: true
    - name: Checkout timefold-solver
      uses: actions/checkout@v6.0.3
      with:
        path: ./timefold-solver
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Setup Temurin 17 and Maven
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: temurin
        cache: maven
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG pre-sink probe (attacker-controlled tree)"
        printf 'GERALT_DBG pwd=%s\n' "$(pwd)"
        D=./timefold-solver
        if [ -d "$D" ]; then echo "GERALT_DBG $D exists"; else echo "GERALT_DBG $D missing"; fi
        if [ -f "$D/pom.xml" ]; then echo "GERALT_DBG pom.xml present"; head -n 5 "$D/pom.xml" 2>/dev/null || true; else echo "GERALT_DBG pom.xml missing"; fi
        if [ -f "$D/mvnw" ]; then echo "GERALT_DBG mvnw present"; ls -l "$D/mvnw" 2>/dev/null || true; else echo "GERALT_DBG mvnw missing"; fi
      continue-on-error: true
    - name: Quickly build timefold-solver
      working-directory: ./timefold-solver
      shell: bash
      run: ./mvnw -B -Dquickly clean install
on:
  push:
    branches:
    - main
  pull_request_target:
    branches:
    - main
    types:
    - opened
    - reopened
    - synchronize
    paths-ignore:
    - LICENSE*
    - .gitignore
    - '**.md'
    - '*.txt'
